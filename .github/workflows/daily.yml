# Once a day:
# - fingerprint the official LEZ testnet; warn if it stops reporting 0.3 or
#   halts (the rollback criteria in docs/dev/cutover-0.3.md). Our own preview
#   network was retired after the cutover (docs/dev/status-2026-10-14.md);
# - export the testimonial evidence (distinct authors, months, each author's
#   prior activity) from chain data and commit it to the `evidence` branch:
#   snapshots/<zone>/<submission>-<date>.json, plus the block-scan cache so
#   the next day resumes where this one stopped. Also kept as a 90-day
#   artifact.
name: Daily

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  OFFICIAL: https://testnet.lez.logos.co

jobs:
  daily:
    name: fingerprint + evidence
    if: github.repository == 'logos-kit/logos-kit'
    permissions:
      contents: write # the evidence branch
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Free disk (the LEZ + RISC Zero build is large)
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev clang cmake ninja-build pkg-config libssl-dev unzip jq
      - name: Vendor LEZ (pinned rev + our patches)
        run: scripts/lez-vendor.sh
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""
          cache-shared-key: workspace-debug
      - name: Build the CLI and xtask
        run: cargo build -q -p logos-kit-cli -p xtask

      - name: Fingerprint the official testnet
        id: fp
        run: |
          mkdir -p out
          cargo xtask fingerprint "$OFFICIAL" > out/official.json || echo '{"version":"unreachable"}' > out/official.json
          echo "official=$(jq -r .version out/official.json)" >> "$GITHUB_OUTPUT"
          echo "official_halted=$(jq -r 'if has("halted") then (.halted | tostring) else "unknown" end' out/official.json)" >> "$GITHUB_OUTPUT"
          jq -c '{version, halted, lastBlockId, headAgeSecs}' out/official.json

      - name: Official testnet still runs 0.3
        run: |
          [ "${{ steps.fp.outputs.official }}" = "0.3" ] || echo "::warning::official testnet reports '${{ steps.fp.outputs.official }}': check the rollback criteria in docs/dev/cutover-0.3.md"
          [ "${{ steps.fp.outputs.official_halted }}" != "true" ] || echo "::warning::official testnet halted"

      - name: Check out the evidence branch
        run: |
          if git fetch -q origin evidence; then
            git worktree add -q evidence FETCH_HEAD
            git -C evidence switch -q -c evidence
          else
            git worktree add -q --orphan -b evidence evidence
          fi

      - name: Evidence exports
        run: |
          export LOGOS_KIT_HOME="$RUNNER_TEMP/wallet" LOGOS_KIT_PASSWORD=daily SUPPRESS_VERBOSE_PRINTS=1
          LK=target/debug/logos-kit
          "$LK" init --json > /dev/null 2>&1
          for zone in testnet; do
            programs=$(jq -r --arg c "lez:$zone" '.[] | select(.name == "testimonial" and .chain == $c) | "--program=" + .account' registry/programs.json)
            [ -n "$programs" ] || { echo "no lez:$zone testimonial deployment yet"; continue; }
            # shellcheck disable=SC2086
            "$LK" --zone "lez-$zone" testimonial evidence $programs --snapshot "evidence/snapshots/$zone" --json \
              | tail -1 > "out/evidence-$zone.json" \
              && jq -c '{distinctAuthors, qualified: .target.qualified, met: .target.met}' "out/evidence-$zone.json" \
              || echo "evidence export for lez:$zone failed"
          done
          mkdir -p out/snapshots && cp -R evidence/snapshots/. out/snapshots/ 2>/dev/null || true

      - name: Commit the evidence
        if: github.ref == 'refs/heads/main'
        run: |
          cd evidence
          git add -A
          git diff --cached --quiet && { echo "no new evidence"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "evidence $(date -u +%F)"
          git push -q origin evidence

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: daily-${{ github.run_id }}
          path: out/
          retention-days: 90

