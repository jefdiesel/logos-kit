[package]
name = "wallet-engine"
description = "Logos Kit wallet engine: keys, accounts, sync, approvals, proving (no Qt)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# rlib for the CLI and tests; cdylib is the C ABI the Basecamp module links
# (include/wallet_engine.h). A dynamic library, so the engine's Rust std never
# collides with the module shim's.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
wallet.workspace = true
lee = { workspace = true, features = ["prove"] }
lee_core.workspace = true
key_protocol.workspace = true
common.workspace = true
sequencer_service_rpc.workspace = true
programs.workspace = true
token_core.workspace = true
token_program.workspace = true
associated_token_account_core.workspace = true
program_loader_core.workspace = true
risc0-binfmt.workspace = true
testimonial_core.workspace = true
borsh.workspace = true
bip39 = { version = "2.2", features = ["zeroize"] }
# vault.v1 (versions already in the lockfile via LEZ: aead 0.5 line)
argon2 = { version = "0.5.3", features = ["zeroize"] }
base64 = "0.22"
chacha20poly1305 = "0.10.1"
tempfile = "3"
zeroize = { version = "1.9", features = ["derive"] }
sha2 = "0.10"
# LNS (`.lez` names): AES-256-GCM is on the aead 0.5 line chacha20poly1305 already uses.
aes-gcm = "0.10.3"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }
ureq.workspace = true
hex = "0.4.3"
png = "0.18.1"
chain-index = { path = "../chain-index" }
unicode-normalization = "0.1.25"
unicode-security = "0.1.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
