[workspace]
resolver = "3"
members = ["crates/*"]
# Basecamp module crates are standalone (builder convention) and RISC Zero
# guests build with cargo-risczero, so neither joins this workspace.
exclude = ["modules", "programs", "vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/logos-kit/logos-kit"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

# LEZ at the pinned rev + our patch series (vendor/lez-patches), materialized
# by `cargo xtask lez-vendor` into vendor/lez (docs/dev/pins.md). Every LEZ
# crate comes from this tree, so there is never a git copy next to a path copy.
wallet = { path = "vendor/lez/lez/wallet", default-features = false }
lee = { path = "vendor/lez/lee/state_machine" }
lee_core = { path = "vendor/lez/lee/state_machine/core" }
key_protocol = { path = "vendor/lez/lee/key_protocol" }
common = { path = "vendor/lez/lez/common" }
sequencer_service_rpc = { path = "vendor/lez/lez/sequencer/service/rpc", features = ["client"] }
programs = { path = "vendor/lez/lez/programs", default-features = false, features = ["artifacts"] }
# LEZ v0.3.1 removed the token, ATA and AMM programs. Their v0.3.0 types
# (lee_core is unchanged, so they still match) are kept in crates/lez-*.
token_core = { path = "crates/lez-token-core" }
token_program = { path = "crates/lez-token-program" }
associated_token_account_core = { path = "crates/lez-ata-core" }
program_loader_core = { path = "vendor/lez/lez/programs/program_loader/core" }
risc0-binfmt = "3.0.2"
# As LEZ declares it (associated_token_account_core hashes with its sha).
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
# Our testimonial program's shared types (the guest has its own workspace).
testimonial_core = { path = "programs/testimonial/core" }
borsh = "1.5.7"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Mirrors LEZ's own patch (logos-execution-zone/Cargo.toml): keccak with the
# RISC Zero-accelerated backend.
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }
